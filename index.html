<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet Awesome Markers CSS & Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/" target="_blank"><i
                                class="bi bi-link-45deg"></i> SV UGM</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th>Nama</th>
                            <td>Mamluatur Rizqi Abdillah Putri</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/561177/SV/26527</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>A</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle">Informasi Penduduk</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet Awesome Markers JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3398631, 122.9946899], 11);

        // Map Panes
        map.createPane('jalan');
        map.getPane('jalan').style.zIndex = 400;

        map.createPane('jumlah_penduduk');
        map.getPane('jumlah_penduduk').style.zIndex = 300;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi dengan Awesome Markers berdasarkan NAMA_UNSUR
        var toponimi = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                var iconName, markerColor;

                switch (feature.properties.NAMA_UNSUR) {
                    case "Gunung":
                        iconName = "mountain";
                        markerColor = "darkred";
                        break;
                    case "Tanjung":
                        iconName = "location-dot"; // Diubah dari bookmark menjadi location-dot
                        markerColor = "orange";
                        break;
                    case "Teluk":
                        iconName = "water";
                        markerColor = "cadetblue";
                        break;
                    case "Toponimi":
                    default:
                        iconName = "house";
                        markerColor = "purple";
                }

                var awesomeIcon = L.AwesomeMarkers.icon({
                    icon: iconName,
                    prefix: 'fa',
                    markerColor: markerColor,
                    iconColor: 'white'
                });

                return L.marker(latlng, { icon: awesomeIcon });
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " +
                    feature.geometry.coordinates[0] + "<br>" +
                    (feature.properties.image ? "<img src='images/" + feature.properties.image + "' alt='' width='200'/>" : "");

                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data);
            map.addLayer(toponimi);
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: "jalan",
            style: function (feature) {
                switch (feature.properties.NAMA_UNSUR) {
                    case "Jalan Propinsi":
                        return { pane: "jalan", color: "red", weight: 3 };
                    case "Jalan Kabupaten":
                        return { pane: "jalan", color: "red", weight: 1.5, dashArray: "10, 5" };
                    case "Jalan Lain":
                        return { pane: "jalan", color: "red", weight: 0.5, dashArray: "3, 3" };
                    default:
                        return { pane: "jalan", color: "red", weight: 1 };
                }
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "NAMA_UNSUR: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "jumlah_penduduk",
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return { pane: "jumlah_penduduk", opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.7, fillColor: '#ffffb2' }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return { pane: "jumlah_penduduk", opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.7, fillColor: '#fd8d3c' }
                }
                if (feature.properties.Penduduk > 24000) {
                    return { pane: "jumlah_penduduk", opacity: 1, color: 'black', weight: 1.0, fillOpacity: 0.7, fillColor: '#bd0026' }
                }
            },
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        $("#featureModalTitle").html("Kecamatan " + feature.properties.WADMKC);
                        $("#featureModalBody").html(
                            "<table class='table table-striped table-bordered'>" +
                            "<tr><th>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + feature.properties.Penduduk + " Jiwa</td></tr>" +
                            "<tr><th>Luas Wilayah</th><td>" + feature.properties.luas_km2 + " km²</td></tr>" +
                            "</table>"
                        );
                        $("#featureModal").modal("show");
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
        });

        // Control Layer dengan Legenda Toponimi yang Diperbarui
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var label_toponimi = "Toponimi<br>" +
            "<div style='margin-left: 20px; font-size: 11px;'>" +
            "<i class='fa fa-mountain text-danger' style='margin-right: 4px;'></i> Gunung<br>" +
            "<i class='fa fa-location-dot text-warning' style='margin-right: 4px;'></i> Tanjung<br>" +
            "<i class='fa fa-water text-primary' style='margin-right: 4px;'></i> Teluk<br>" +
            "<i class='fa fa-house text-purple' style='margin-right: 4px;'></i> Permukiman/Lainnya" +
            "</div>";

        var label_jalan = "Jalan<br>" +
            "<div style='margin-left: 20px; font-size: 11px;'>" +
            "<svg width='24' height='10' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='5' x2='24' y2='5' stroke='red' stroke-width='3'/></svg> Jalan Propinsi<br>" +
            "<svg width='24' height='10' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='5' x2='24' y2='5' stroke='red' stroke-width='1.5' stroke-dasharray='6, 3'/></svg> Jalan Kabupaten<br>" +
            "<svg width='24' height='10' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='5' x2='24' y2='5' stroke='red' stroke-width='0.5' stroke-dasharray='2, 2'/></svg> Jalan Lain" +
            "</div>";

        var label_penduduk = "Jumlah Penduduk<br>" +
            "<div style='margin-left: 20px; font-size: 11px;'>" +
            "<span style='display: inline-block; width: 12px; height: 12px; background-color: #ffffb2; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></span> &le; 12.000<br>" +
            "<span style='display: inline-block; width: 12px; height: 12px; background-color: #fd8d3c; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></span> 12.001 - 24.000<br>" +
            "<span style='display: inline-block; width: 12px; height: 12px; background-color: #bd0026; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></span> &gt; 24.000" +
            "</div>";

        var overlayMaps = {
            [label_toponimi]: toponimi,
            [label_jalan]: jalan,
            [label_penduduk]: jumlah_penduduk
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            metric: true,
            imperial: false
        }).addTo(map);
    </script>
</body>

</html>
